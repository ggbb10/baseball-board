<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173e31">
  <meta name="description" content="用棒球戰術板移動球員、繪製路線，逐步推演守備情境。">
  <title>棒球戰術板 · Diamond Desk</title>
  <style>:root {
  color-scheme: light;
  --paper: #f7f8f4;
  --surface: #ffffff;
  --forest: #173e31;
  --green: #235541;
  --ink: #202f27;
  --muted: #657268;
  --line: #dce1d9;
  --soft: #eff3ed;
  --clay: #ac532b;
  --warm: #f8eadd;
  --sans: "Inter", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", system-ui, sans-serif;
  --display: "Barlow Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", var(--sans);
}

*, *::before, *::after { box-sizing: border-box; }
html { min-width: 300px; scroll-behavior: smooth; }
#presets-heading { scroll-margin-top: 16px; }
#important-concepts { scroll-margin-top: 16px; }
.concept-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.concept-card { display: grid; align-content: center; gap: 4px; text-align: left; color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 8px; padding: 12px 15px; background: var(--surface); }
.concept-card:hover { border-color: var(--green); background: var(--soft); }
.concept-title { font-size: 15px; overflow-wrap: anywhere; }
.concept-details, .concept-empty { color: var(--muted); font-size: 13px; }
.concept-empty { padding: 10px 0; }
@media (max-width: 610px) {
  #tokens > g > circle, #tokens > g > text, #tokens > g > g, #tokens > g[data-player="BR"] > path { scale: 1.3; transform-origin: 0 0; }
  #tokens > g > circle[fill="transparent"] { scale: 1.7; }
}
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid #bd6638; outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
button { border: 0; background: transparent; }
a { color: inherit; text-decoration: none; }
.hidden, [hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; clip-path: inset(50%); }
.icon { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; vertical-align: middle; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.nav-shell, .container { width: min(100% - clamp(36px, 6.4vw, 100px), 1520px); margin-inline: auto; }
.nav-shell { min-height: 68px; display: flex; align-items: center; gap: clamp(24px, 4.4vw, 74px); }
.brand { display: inline-flex; align-items: center; gap: 11px; flex: 0 0 auto; padding: 0; color: var(--forest); }
.brand > svg { width: 34px; height: 34px; flex: none; }
.brand > span { font-family: var(--display); font-size: 20px; font-weight: 850; letter-spacing: .035em; line-height: 1; }
.main-nav { display: flex; align-self: stretch; align-items: stretch; gap: 24px; }
.nav-item, .help-link { display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted); font-weight: 650; white-space: nowrap; }
.nav-item { position: relative; min-height: 44px; padding: 2px 3px 0; font-size: 14px; }
.nav-item.active, .nav-item[aria-current="page"] { color: var(--forest); }
.nav-item.active::after, .nav-item[aria-current="page"]::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--green); border-radius: 3px 3px 0 0; }
.help-link { margin-left: auto; font-size: 13px; padding: 8px 0 8px 8px; }
.nav-item:hover, .help-link:hover { color: var(--forest); }
.container { padding-bottom: 50px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 29px 0 24px; }
.page-title h1 { font-size: clamp(29px, 2.65vw, 41px); font-weight: 800; letter-spacing: -.048em; line-height: 1.25; color: var(--forest); }
.page-title p, .section-heading p { color: var(--muted); font-size: 14px; margin-top: 5px; }
.eyebrow { display: flex; align-items: center; gap: 7px; color: var(--clay); font: 750 11px/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.page-actions, .tools-group { display: inline-flex; align-items: center; gap: 8px; }
.page-actions { flex: 0 0 auto; }
.btn, .play-btn, .text-btn, .icon-btn, .tool, .base-choice { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 680; line-height: 1.2; }
.btn { min-height: 39px; border-radius: 7px; border: 1px solid var(--line); padding: 8px 15px; }
.primary, .play-btn { background: var(--forest); border-color: var(--forest); color: #fff; }
.secondary { background: #fff; color: var(--ink); }
.btn:hover:not(:disabled), .play-btn:hover:not(:disabled) { filter: brightness(.95); }
.secondary:hover:not(:disabled) { border-color: #b8c6b9; }

.workspace-grid { display: grid; grid-template-columns: minmax(0, 2.12fr) minmax(300px, 1fr); gap: 19px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; box-shadow: 0 2px 5px #18382705; }
.panel-head { min-height: 51px; padding: 13px 18px; display: flex; align-items: center; justify-content: space-between; gap: 9px; border-bottom: 1px solid var(--line); }
.head-title { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
.panel-head h2, .head-title h2 { font-size: 16px; line-height: 1.3; font-weight: 760; letter-spacing: -.025em; }
.icon-box { display: inline-grid; place-items: center; color: var(--green); }
.icon-box .icon { width: 19px; height: 19px; }
.pill { font-size: 11px; color: var(--green); background: #eaf2e7; border: 1px solid #d6e5d5; border-radius: 100px; padding: 2px 7px; line-height: 1.4; font-weight: 700; white-space: nowrap; }
.head-meta { color: var(--muted); font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 0; }
.field-panel { overflow: hidden; }
.field-wrap { position: relative; isolation: isolate; width: 100%; aspect-ratio: 1000/620; overflow: hidden; background: #173d30; }
#field { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; touch-action: none; }
.field-hud, .field-key, .field-tag { position: absolute; pointer-events: none; z-index: 1; font-variant-numeric: tabular-nums; }
.field-hud { top: 14px; left: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; width: fit-content; max-width: calc(100% - 30px); color: #f6faef; background: #10291ed9; border: 1px solid #d9edcf35; border-radius: 5px; padding: 5px 9px; font-size: 11px; line-height: 1.25; font-weight: 700; }
.field-key, .field-tag { bottom: 14px; font-size: 11px; line-height: 1.25; font-weight: 650; color: #f0f3e6; }
.field-key { left: 15px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.field-key > span, .field-tag > span { display: inline-flex; align-items: center; gap: 5px; }
.field-tag { right: 15px; font-family: var(--display); font-size: 10px; letter-spacing: .1em; color: #c8d9c8; }
.field-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 14px; min-height: 52px; }
.tool, .icon-btn { min-height: 33px; border-radius: 5px; padding: 6px 9px; color: var(--muted); border: 1px solid transparent; }
.tool[aria-pressed="true"], .tool.active { color: var(--green); background: #e8f0e6; border-color: #d5e2d3; }
.tool:hover:not(:disabled), .icon-btn:hover:not(:disabled), .text-btn:hover:not(:disabled) { color: var(--forest); background: var(--soft); }
.icon-btn { width: 33px; padding: 6px; }
.sidebar { display: grid; min-width: 0; gap: 14px; }
.panel-body { padding: 15px 18px 16px; }
.control-panel .panel-body { display: grid; gap: 15px; }
.form-row { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.form-row > .control { flex: 1 1 0; }
.control { min-width: 0; }
.field-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.35; }
.stepper, .segmented { display: flex; min-height: 33px; border: 1px solid var(--line); background: #fafbf8; border-radius: 6px; align-items: stretch; overflow: hidden; }
.stepper { align-items: center; justify-content: space-between; }
.stepper button, .segmented button { flex: 1 1 0; min-width: 0; min-height: 31px; font-size: 12px; font-weight: 700; line-height: 1.15; padding: 3px 5px; color: var(--muted); }
.stepper button { flex: 0 0 29px; font-size: 16px; padding: 2px; }
.stepper button .icon { width: 13px; height: 13px; }
.stepper > span, .stepper > output, .stepper > strong { font-size: 13px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; }
.segmented { gap: 2px; padding: 2px; }
.segmented button { border: 1px solid transparent; border-radius: 4px; min-height: 27px; }
.segmented button.active, .segmented button[aria-pressed="true"] { background: #e1ebdf; border-color: #cbdcc8; color: var(--forest); }
.stepper button:hover:not(:disabled), .segmented button:hover:not(:disabled) { background: #e8efe5; color: var(--forest); }
.base-options { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 6px; }
.base-choice { min-height: 32px; padding: 4px 7px; border: 1px solid var(--line); color: var(--muted); border-radius: 5px; white-space: nowrap; }
.base-choice[aria-pressed="true"], .base-choice.active { color: var(--clay); border-color: #dcaf8d; background: #fcf0e4; }
.base-choice:hover:not(:disabled) { border-color: #c79f80; }
.batter-control { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.batter-control label { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 650; font-size: 14px; }
.batter-control input { accent-color: var(--clay); width: 17px; height: 17px; margin: 0; }
.batter-control .run-target-label { color: var(--muted); font-size: 13px; }
#run-target { min-height: 33px; border: 1px solid var(--line); border-radius: 5px; background-color: var(--surface); color: var(--ink); padding: 3px 7px; }
.run-hint { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.base-diamond { display: inline-block; width: 8px; height: 8px; transform: rotate(45deg); border: 1.25px solid currentColor; }
.base-choice[aria-pressed="true"] .base-diamond { background: #c56b3c; }
.text-btn { color: var(--green); font-size: 12px; border-radius: 4px; padding: 5px 4px; gap: 4px; }
.text-btn .icon { width: 15px; height: 15px; }
.timeline-panel .panel-body { padding-top: 11px; }
.step-list { display: grid; gap: 4px; max-height: 240px; overflow: auto; scrollbar-width: thin; }
.step-row { width: 100%; min-width: 0; display: flex; gap: 10px; align-items: center; text-align: start; padding: 7px 9px; border: 1px solid transparent; border-radius: 6px; min-height: 38px; }
.step-row.active, .step-row[aria-current="step"] { background: #edf3e9; border-color: #d6e2d1; }
.step-row:hover:not(:disabled) { background: #f0f4ec; }
.step-num { width: 24px; height: 24px; border: 1px solid var(--line); border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface); color: var(--muted); flex: none; font: 750 12px/1 var(--display); font-variant-numeric: tabular-nums; }
.step-row.active .step-num { background: var(--green); color: #fff; border-color: var(--green); }
.step-copy { display: flex; flex: 1; flex-direction: column; min-width: 0; font-size: 13px; }
.step-copy > strong, .step-copy > b { color: var(--ink); font-weight: 700; }
.step-copy small, .step-copy > em { color: var(--muted); font-size: 11px; font-style: normal; }
.step-row > .icon { width: 14px; height: 14px; color: var(--muted); }
.play-btn { width: 100%; min-height: 38px; margin-top: 12px; border-radius: 6px; }
.play-btn .icon { width: 16px; height: 16px; }

.section-heading { display: flex; align-items: baseline; gap: 13px; margin: 26px 0 12px; }
.section-heading h2 { font-size: clamp(19px, 1.6vw, 24px); color: var(--forest); line-height: 1.3; font-weight: 780; letter-spacing: -.03em; }
.section-heading p { font-size: 13px; margin: 0; }
.preset-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
.preset-card { display: flex; align-items: center; text-align: start; gap: 12px; width: 100%; min-width: 0; background: var(--surface); padding: 10px; color: var(--ink); border: 1px solid var(--line); border-radius: 9px; transition: border-color .15s, box-shadow .15s; }
.preset-card:hover, .preset-card:focus-within { border-color: #a0b59e; box-shadow: 0 3px 9px #1838270d; }
.preset-art { display: grid; place-items: center; flex: 0 0 63px; width: 63px; aspect-ratio: 1.22; overflow: hidden; border-radius: 5px; background: #e9efe2; color: var(--green); }
.preset-art svg { width: 100%; height: 100%; display: block; }
.preset-copy { min-width: 0; }
.preset-copy h3 { font-size: 14px; line-height: 1.35; font-weight: 740; }
.preset-copy p { font-size: 11.5px; line-height: 1.4; margin-top: 3px; color: var(--muted); }
.preset-code { font: 750 10px/1.2 var(--display); color: var(--clay); letter-spacing: .08em; }

.modal { color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 13px; box-shadow: 0 20px 80px #142e2533; padding: 0; width: min(94vw, 500px); max-height: 85dvh; }
.modal::backdrop { background: #182b225e; }
.modal-head, .modal-foot, .saved-row { display: flex; align-items: center; gap: 10px; }
.modal-head { justify-content: space-between; border-bottom: 1px solid var(--line); padding: 15px 20px; }
.modal-head h2 { font-size: 18px; color: var(--forest); }
.modal-body { padding: 20px; }
.modal-body p + p { margin-top: 9px; }
.modal-body label { display: block; margin-bottom: 5px; }
.modal-foot { justify-content: flex-end; padding: 12px 20px; background: #f7f9f4; border-top: 1px solid var(--line); }
.input { width: 100%; min-height: 39px; padding: 7px 11px; border: 1px solid #cbd5cb; background: white; border-radius: 5px; color: var(--ink); }
.saved-list { display: grid; gap: 9px; }
.saved-row { padding: 10px; border: 1px solid var(--line); border-radius: 7px; }
.saved-row > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; width: max-content; max-width: calc(100vw - 32px); color: #fff; border: 1px solid #567962; background: var(--forest); box-shadow: 0 5px 24px #12211b29; padding: 10px 17px; border-radius: 8px; font-size: 13px; text-align: center; }
.toast:empty { display: none; }

.field-panel .panel-head { padding-block: 8px; }
.field-panel .head-title { flex: 1; }
.field-panel .head-title h2, .field-panel .icon-box { flex: none; }
.field-panel .pill, .step-copy > strong, .step-copy > small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field-hud .mini-inning { color: #fff4d6; }
.hud-divider { display: block; width: 1px; height: 11px; background: #d9e7cf59; }
.key-dot { display: inline-block; position: relative; width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1px solid #f1f2db94; }
.key-dot.fielder { background: #e8ebcf; }
.key-dot.runner { background: #c56b43; }
.key-dot.batter { background: #b76a36; border-radius: 0; clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%); }
.key-dot.ball { background: #fff6e7; border-color: #f1e4d3; overflow: hidden; }
.key-dot.ball::before, .key-dot.ball::after { content: ""; position: absolute; top: -1px; width: 6px; height: 9px; border: 1px dashed #b96247; border-radius: 50%; }
.key-dot.ball::before { left: -5px; }
.key-dot.ball::after { right: -5px; }
.field-key { background: #123226b8; padding: 5px 8px; border: 1px solid #d9edcf22; border-radius: 4px; }
.field-play { position: absolute; right: 12px; bottom: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 5px; border-radius: 5px; padding: 5px 9px; font-weight: 650; font-size: 13px; color: #fff9e7; background: #16392e; border: 1px solid #c8dfbd77; }
.field-play .icon { width: 14px; height: 14px; }
.drill-step-hud { position: absolute; top: 12px; right: 12px; max-width: 52%; padding: 4px 8px; border-radius: 5px; background: #16392ee8; color: #fffcf0; font-size: 12px; line-height: 1.4; pointer-events: none; }
@media (max-width: 610px) { .drill-step-hud { top: 6px; right: 5px; font-size: 10px; } }
.history-tools { padding-left: 9px; border-left: 1px solid var(--line); }
.step-entry { position: relative; min-width: 0; }
.step-entry .step-row { padding-right: 39px; }
.step-edit { position: absolute; top: 50%; right: 5px; transform: translateY(-50%); display: inline-grid; place-items: center; width: 29px; height: 29px; padding: 5px; color: #697b6f; border-radius: 4px; }
.step-edit:hover:not(:disabled) { background: #dae6d5; color: var(--forest); }
.step-edit .icon { width: 14px; height: 14px; }
.step-entry:focus-within { outline: 2px solid var(--green); outline-offset: -2px; border-radius: 6px; }
.step-entry:focus-within .step-edit:focus-visible { outline-offset: 0; }
.add-step { width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px dashed #b9caba; border-radius: 5px; background: #fbfcf9; color: var(--green); min-height: 31px; font-weight: 650; font-size: 12px; margin-top: 7px; }
.add-step .icon { width: 14px; height: 14px; }
.add-step:hover:not(:disabled) { background: var(--soft); border-color: var(--green); }
.play-btn:disabled { opacity: 1; color: #546b59; background: #e5ebe2; border: 1px solid #d6e0d2; }
.timeline-tip { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 7px; text-align: center; }
.timeline-tip:empty { display: none; }
.end-playback { width: 100%; margin-top: 5px; }
.modal-body { overflow-wrap: anywhere; }
.modal-body label, .modal-body strong { font-weight: 690; }
.modal-body label { font-size: 13px; }
.modal-body p { font-size: 14px; }
.modal-body strong { color: var(--forest); }
.modal-body [role="alert"]:not([hidden]) { border: 1px solid #e3c0ac; background: #fbf1e9; border-radius: 5px; padding: 7px 10px; margin-bottom: 12px; }
.saved-row small { color: var(--muted); font-size: 11px; }
.saved-row .btn, .saved-row .text-btn { flex-shrink: 0; }
.danger, .saved-row .text-btn { color: #a6482e; }
.modal-foot .danger { margin-right: auto; }
body.field-expanded { overflow: hidden; }
.field-panel.is-expanded { position: fixed; z-index: 15; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border: 0; border-radius: 0; }
.field-panel.is-expanded .field-wrap { display: grid; place-items: center; height: 100%; aspect-ratio: auto; container-type: size; }
.field-panel.is-expanded #field { width: min(100cqw, 161.2903226cqh); height: auto; max-height: 100%; aspect-ratio: 1000/620; }
.field-panel.is-expanded .field-tools { padding-bottom: max(9px, env(safe-area-inset-bottom)); }

@media (min-width: 1550px) {
  .workspace-grid { grid-template-columns: minmax(0, 2.2fr) minmax(360px, 1fr); }
  .panel-body { padding: 20px 23px; }
  .panel-head { padding-inline: 23px; min-height: 57px; }
  .step-row { min-height: 45px; }
}
@media (max-width: 1100px) {
  .workspace-grid { grid-template-columns: minmax(0, 1.85fr) minmax(275px, 1fr); gap: 14px; }
  .panel-head, .panel-body { padding-inline: 14px; }
  .preset-art { flex-basis: 46px; width: 46px; }
  .preset-card { gap: 8px; }
  .tool { padding-inline: 7px; }
  .tools-group { gap: 4px; }
}
@media (max-width: 850px) {
  .workspace-grid { grid-template-columns: minmax(0, 1fr); }
  .sidebar { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .preset-art { flex-basis: 60px; width: 60px; }
}
@media (max-width: 610px) {
  .nav-shell, .container { width: calc(100% - 28px); }
  .nav-shell { min-height: 54px; gap: 16px; flex-wrap: wrap; }
  .brand { gap: 6px; }
  .brand > svg { width: 27px; height: 27px; }
  .brand > span { font-size: 16px; }
  .main-nav { gap: 10px; }
  .nav-item { font-size: 12px; padding-inline: 1px; gap: 3px; }
  .nav-item .icon { width: 14px; height: 14px; }
  .help-link { padding-inline: 0; font-size: 12px; gap: 3px; }
  .help-link .icon { width: 15px; height: 15px; }
  .page-head { align-items: flex-start; flex-direction: column; gap: 12px; padding: 20px 0 15px; }
  .page-title p { font-size: 13px; }
  .page-actions .btn { min-height: 36px; padding-inline: 12px; }
  .sidebar { grid-template-columns: 1fr; }
  .panel { border-radius: 9px; }
  .panel-head { min-height: 45px; padding-block: 10px; }
  .field-hud { top: 7px; left: 7px; font-size: 9px; padding: 4px 6px; }
  .field-key { left: 7px; }
  .field-key, .field-tag { bottom: 6px; font-size: 8px; }
  .field-tag { right: 7px; }

<script>(() => {
  'use strict';

  const groups = [
    { id: 'first', title: '一壘跑者，未滿兩出局', shortTitle: '一壘有人', bases: [true, false, false], focus: 1, outs: 0 },
    { id: 'second-open', title: '二壘跑者，一壘無人，未滿兩出局', shortTitle: '二壘有人', bases: [false, true, false], focus: 2, outs: 0 },
    { id: 'third-open', title: '三壘跑者，一、二壘無人，未滿兩出局', shortTitle: '三壘有人', bases: [false, false, true], focus: 3, outs: 0 },
    { id: 'second-forced', title: '一、二壘有人，二壘跑者的判斷，未滿兩出局', shortTitle: '一、二壘有人', bases: [true, true, false], focus: 2, outs: 0 },
    { id: 'loaded', title: '滿壘，三壘跑者的判斷，未滿兩出局', shortTitle: '滿壘', bases: [true, true, true], focus: 3, outs: 0 },
    { id: 'two-outs', title: '兩出局，各壘跑者的起跑', shortTitle: '兩出局', bases: [true, true, true], focus: 'all', outs: 2 }
  ];

  const titles = {
    pop: '內野高飛球',
    groundLeft: '內野左側滾地球',
    groundRight: '內野右側滾地球',
    line: '平飛球',
    deep: '深遠飛球',
    deepLeft: '左外野深遠飛球',
    deepRight: '右外野深遠飛球',
    foul: '深遠界外飛球',
    foulLeft: '左外野深遠界外飛球',
    foulRight: '右外野深遠界外飛球'
  };
  const baseNames = { 1: '一壘', 2: '二壘', 3: '三壘', 4: '本壘' };
  const cases = [];

  function add(groupId, kind, note, choices) {
    const { focus } = groups.find(group => group.id === groupId);
    const destination = baseNames[focus + 1];
    function variant(id) {
      if (id === 'run') return { id, title: '擊球即全速起跑' };
      if (id === 'stay') return { id, title: '留在' + baseNames[focus] };
      if (id === 'tag') return { id, title: '踩壘後跑向' + destination };
      const prefix = kind === 'groundLeft' || kind === 'groundRight' ? '推進至' : '界內落地後跑向';
      return { id, title: prefix + destination };
    }
    cases.push({ id: 'drill-' + groupId + '-' + kind, groupId, title: titles[kind], kind, note, variants: choices.map(variant) });
  }

<script>(() => {
  'use strict';

  const p = (x, y) => ({ x, y });
  const bags = [null, p(620, 418), p(500, 298), p(380, 418), p(500, 538)];
  const names = ['', '一壘', '二壘', '三壘', '本壘'];
  const contact = p(474, 508);
  const copy = value => JSON.parse(JSON.stringify(value));
  const mix = (a, b, t) => p(Math.round(a.x + (b.x - a.x) * t), Math.round(a.y + (b.y - a.y) * t));
  const offset = (v, x, y) => p(v.x + x, v.y + y);
  const vector = (type, a, b) => ({ type, x1: a.x, y1: a.y, x2: b.x, y2: b.y });

  // The left/right foul points lie outside their chalk lines and inside the park.
  const flights = {
    pop:       { fielder: 'SS', end: p(422, 314) },
    line:      { fielder: 'LF', end: p(332, 250) },
    deep:      { fielder: 'CF', end: p(521, 91) },
    deepLeft:  { fielder: 'LF', end: p(284, 148) },
    deepRight: { fielder: 'RF', end: p(718, 148) },
    foul:      { fielder: 'LF', end: p(165, 256) },
    foulLeft:  { fielder: 'LF', end: p(154, 249) },
    foulRight: { fielder: 'RF', end: p(846, 249) }
  };

  function buildPracticePlay(drill, group, variantId, standardPlay, revision = 2) {
    const play = copy(standardPlay);
    const choice = drill.variants.find(option => option.id === variantId) || drill.variants[0];
    const variant = choice.id;
    const kind = drill.kind;
    const twoOuts = group.outs === 2;
    const ground = kind === 'groundLeft' || kind === 'groundRight';
    const foul = kind.startsWith('foul');
    const caught = !ground && (foul || variant === 'stay' || variant === 'tag');
    const active = [1, 2, 3].filter(n => group.bases[n - 1]);
    const focus = group.focus;
    const targetName = focus === 'all' ? '下一壘' : names[focus + 1];
    const start = copy(play.frames[0].positions);
    start.B = contact;
    const firstBasePop = drill.id === 'drill-first-pop' && revision >= 2;
    if (firstBasePop) start['2B'] = { ...bags[2] };
    for (const n of active) start['R' + n] = { ...bags[n] };
    Object.assign(play, {
      title: group.shortTitle + '・' + drill.title + '・' + choice.title,
      scenarioId: drill.id, practiceVariant: variant, outs: group.outs,
      bases: [...group.bases], batter: true, runTarget: null,
      frames: [{ name: twoOuts ? '兩出局，擊球即起跑' : '踩穩原壘，準備讀球', positions: start, lines: [], batterBase: 0 }]
    });

    function add(name, change, { pass = null, batterBase = 0, batterOut = false } = {}) {
      const last = play.frames[play.frames.length - 1];
      const previous = last.positions;
      const positions = copy({ ...previous, ...change });
      const lines = [];
      for (const n of active) {
        const id = 'R' + n;
        const a = previous[id], b = positions[id];
        if (Math.hypot(a.x - b.x, a.y - b.y) >= 22) lines.push(vector('move', a, b));
      }
      if (pass) lines.push(vector('throw', pass, positions.B));
      const frame = { name, positions, lines, batterBase };
      if (batterOut || last.batterOut) frame.batterOut = true;
      play.frames.push(frame);
    }

    function runners(progress, include = () => true) {
      const changes = {};
      for (const n of active) {
        if (include(n)) changes['R' + n] = mix(bags[n], bags[n + 1], progress);
      }
      return changes;
    }
    const batterAt = t => mix(start.BR, bags[1], t);

    if (firstBasePop) {
      play.practiceRevision = 2;
      const landing = p(421, 324);
      const looseBall = p(376, 292);
      add('一壘跑者離壘三、四步，看游擊手追球', {
        ...runners(.18), BR: batterAt(.23), B: mix(contact, landing, .55), SS: p(408, 302)
      });
      if (caught) {
        add('跑者回踩一壘，游擊手移到落點', {
          ...runners(0), BR: batterAt(.4), B: mix(contact, landing, .83), SS: p(405, 310)
        });
        add('游擊手接殺並持球，跑者留在一壘', {
          B: landing, SS: p(406, 311), BR: batterAt(.5)
        }, { batterOut: true });
      } else {
        add('球在界內落地，一壘跑者加速進二壘', {
          B: landing, SS: p(400, 320), ...runners(.35), BR: batterAt(.43)
        });
        add('球彈向游擊區，游擊手轉身追球', {
          B: looseBall, SS: p(397, 315), ...runners(.76), BR: batterAt(.73)
        });
        add('游擊手撿起球，跑者抵達二壘', {
          B: looseBall, SS: p(362, 280), ...runners(1), BR: bags[1]
        }, { batterBase: 1 });
      }
      return play;
    }

    if (ground) {
      const left = kind === 'groundLeft';
      const infielder = left ? 'SS' : '2B', outfielder = left ? 'LF' : 'RF';
      const pickup = left ? p(407, 346) : p(593, 346);
      const outfield = left ? p(331, 247) : p(669, 247);
      const glove = offset(pickup, left ? -18 : 18, -14);
      const holds = variant === 'stay';
      const readFirst = !twoOuts && left && !group.bases[0];
      const running = n => !holds || n !== focus;
      add(readFirst ? '追蹤左側滾地球，先看接球位置' : (twoOuts ? '各壘跑者擊球即全速起跑' : '球落地，立即全速奔向' + targetName), {
        ...runners(readFirst ? .08 : .3, running), BR: batterAt(.27),
        B: mix(contact, pickup, .53), [infielder]: mix(start[infielder], glove, .45)
      });
      add(holds ? '野手迎球並牽制，跑者留在原壘' : '滾地球穿越內野，跑者加速', {
        ...runners(.58, running), BR: batterAt(.54), B: pickup,
        [infielder]: holds ? glove : offset(glove, left ? 25 : -25, 5),
        [outfielder]: mix(start[outfielder], outfield, .33), '1B': p(647, 390)
      });
      if (holds) {
        const received = p(635, 396);
        add('野手看住前位跑者，打者先踩一壘', {
          ...runners(0), BR: bags[1]
        }, { batterBase: 1 });
        add('傳一壘已晚，跑者守住' + names[focus], {
          B: received, '1B': p(651, 379)
        }, { pass: pickup, batterBase: 1 });
      } else {
        add('外野手上前收球，跑者持續推進', {
          ...runners(.83), BR: batterAt(.8), B: outfield,
          [outfielder]: offset(outfield, left ? -17 : 17, -16), [infielder]: mix(glove, p(500, 312), .3)
        });
        const cut = left ? p(432, 307) : p(568, 307);
        add('跑者踩到' + targetName + '，打者安全上一壘', {
          ...runners(1), BR: bags[1], B: cut, [infielder]: offset(cut, left ? -18 : 18, -13)
        }, { pass: outfield, batterBase: 1 });
      }
      return play;
    }

    const unusualPop = kind === 'pop' && !twoOuts && group.bases[0] && group.bases[1];
    const flight = unusualPop ? { fielder: 'LF', end: p(405, 235) } : flights[kind];
    const { fielder, end } = flight;
    const left = end.x < 500;
    const side = left ? -1 : 1;
    const glove = offset(end, side * 17, -14);
    const pickup = offset(end, side * 15, -13);
    const relay = left ? 'SS' : '2B';
    const cut = left ? p(425, 277) : p(575, 277);
    const backup = fielder === 'CF' ? 'RF' : 'CF';
    const readyToCatch = caught && !twoOuts;
    const batting = t => foul && !twoOuts ? {} : { BR: batterAt(t) };

    add(twoOuts ? '各壘跑者全速起跑，持續看球'
      : foul ? '踩住原壘，看野手追向界外' : '離壘三至四步，先停下看球', {
      ...runners(twoOuts ? .34 : foul ? 0 : .2), ...batting(.24),
      B: mix(contact, end, .43), [fielder]: mix(start[fielder], glove, .35)
    });
    add(twoOuts ? '跑者繼續衝刺，野手追向落點'
      : readyToCatch ? (foul ? '持續踩壘，等野手首次觸球' : '判斷可能接住，先回踩原壘')
        : '維持三至四步，確認球的落點', {
      ...runners(twoOuts ? .62 : readyToCatch ? 0 : .2), ...batting(.47),
      B: mix(contact, end, .78), [fielder]: mix(start[fielder], glove, .72),
      [backup]: mix(start[backup], end, .12)
    });

    if (caught) {
      if (twoOuts) {
        add('示範界外球接殺，第三出局、半局結束', {
          ...runners(.8), ...batting(.71), B: end, [fielder]: glove
        }, { batterOut: true });
        return play;
      }
      add(foul ? '界外飛球接住，跑者踩著原壘' :
        unusualPop ? '野手追至內野後方接殺，跑者已回踩' : '守備員首次觸球並接殺，跑者已回踩', {
        ...runners(0), ...batting(.68), B: end, [fielder]: glove
      }, { batterOut: true });
      // A catch removes every force. Only the designated, legally tagged runner tries to advance.
      const go = variant === 'tag';
      const receiver = fielder === relay ? '2B' : relay;
      const tagName = kind === 'pop' ? '野手接穩後跌坐，從' + names[focus] + '起跑' : '看準回傳空檔，從' + names[focus] + '起跑';
      add(go ? tagName : '判斷回傳距離，留在' + names[focus], {
        ...runners(go ? .52 : 0, n => n === focus), B: cut, [receiver]: offset(cut, side * 17, -14)
      }, { pass: end });
      if (go) add('跑者安全踩到' + targetName, { ...runners(1, n => n === focus) });
      return play;
    }

    add(unusualPop ? '內野後方空檔落球，未宣告高飛必死球' : '球在界內落地，確認可以推進', {
      ...runners(twoOuts ? .8 : .44), ...batting(.66),
      B: end, [fielder]: offset(glove, -side * 15, -17)
    });
    add('野手撿球，跑者全速奔向' + targetName, {
      ...runners(twoOuts ? .92 : .79), ...batting(.84),
      B: pickup, [fielder]: offset(pickup, side * 17, -14)
    });
    const receiver = fielder === relay ? '2B' : relay;
    add('跑者踩到' + targetName + '，打者安全上壘', {
      ...runners(1), BR: bags[1], B: cut, [receiver]: offset(cut, side * 18, -14)
    }, { pass: pickup, batterBase: 1 });
    return play;
  }

  window.buildPracticePlay = buildPracticePlay;
})();
</script>

    { id: 'R2', label: 'R2', name: '二壘跑者', kind: 'runner' },
    { id: 'R3', label: 'R3', name: '三壘跑者', kind: 'runner' }
  ];

  const presets = [
    { id: 'standard', title: '標準守備', description: '從九人基本守備站位開始，自訂跑位與傳球。', category: '基本站位' },
    { id: 'relay', title: '外野中繼', description: '左外野接球後，經游擊手中繼傳回本壘。', category: '中繼傳球' },
    { id: 'bunt', title: '短打守備', description: '一壘有人，三壘手趨前處理短打並傳一壘。', category: '短打應對' },
    { id: 'double', title: '內野雙殺', description: '游擊手接滾地球，策動六、四、三雙殺。', category: '內野配合' }
  ];

  const point = (x, y) => ({ x, y });
  const batterStops = [
    point(520, 519), point(620, 418), point(500, 298), point(380, 418), point(500, 538)
  ];
  const original = {
    P: point(500, 421), C: point(500, 569), '1B': point(651, 382),
    '2B': point(587, 295), '3B': point(349, 382), SS: point(413, 295),
    LF: point(267, 206), CF: point(500, 122), RF: point(733, 206),
    B: point(533, 438), BR: batterStops[0], R1: point(637, 439), R2: point(500, 271), R3: point(363, 439)
  };
  const move = (x1, y1, x2, y2) => ({ type: 'move', x1, y1, x2, y2 });
  const pass = (x1, y1, x2, y2) => ({ type: 'throw', x1, y1, x2, y2 });
  const clone = value => JSON.parse(JSON.stringify(value));

  function frame(name, previous, changes = {}, lines = [], batterBase = 0) {
    return { name, positions: clone({ ...previous, ...changes }), lines, batterBase };
  }

  function relay() {
    const start = frame('二壘有人', original, { B: point(474, 508) });
    const field = frame('左外野接球', start.positions, {
      LF: point(220, 201), CF: point(398, 130), SS: point(344, 276),
      '2B': point(503, 311), '3B': point(378, 409), P: point(536, 523),
      C: point(501, 548), R2: point(390, 397), BR: point(568, 491), B: point(235, 214)
    }, [move(267, 206, 220, 201), move(413, 295, 344, 276)]);
    const cut = frame('游擊手接中繼', field.positions, {
      SS: point(338, 294), R2: point(398, 435), P: point(544, 570), BR: point(604, 453), B: point(352, 306)
    }, [pass(235, 214, 352, 306)]);
    const home = frame('回傳本壘', cut.positions, {
      C: point(491, 527), R2: point(468, 503), BR: batterStops[1], B: point(482, 515)
    }, [pass(352, 306, 482, 515)], 1);
    return [start, field, cut, home];
  }

  function bunt() {
    const start = frame('一壘有人', original, { '1B': point(623, 396), B: point(474, 508) });
    const field = frame('三壘手趨前接球', start.positions, {
      '3B': point(455, 473), '1B': point(552, 451), '2B': point(601, 376),
      SS: point(485, 309), P: point(484, 457), C: point(498, 535),
      R1: point(571, 366), BR: point(540, 513), B: point(469, 484)
    }, [move(349, 382, 455, 473), move(587, 295, 601, 376)]);
    const cover = frame('二壘手補一壘', field.positions, {
      '2B': point(620, 409), SS: point(500, 307), R1: point(527, 320), BR: point(569, 488)
    }, [move(601, 376, 620, 409)]);
    const first = frame('三壘手傳一壘', cover.positions, {
      B: point(609, 424), R1: point(486, 288), BR: point(598, 467)
    }, [pass(469, 484, 609, 424)]);
    return [start, field, cover, first];
  }

  function doublePlay() {
    const start = frame('雙殺守備站位', original, {
      SS: point(425, 318), '2B': point(571, 318), '1B': point(622, 397), B: point(474, 508)
    });
    const field = frame('游擊手接滾地球', start.positions, {
      SS: point(421, 346), '2B': point(530, 311), '1B': point(621, 406),
      R1: point(571, 366), BR: point(540, 512), B: point(435, 357)
    }, [move(425, 318, 421, 346), move(571, 318, 530, 311)]);
    const pivot = frame('傳二壘封殺', field.positions, {
      '2B': point(507, 294), R1: point(527, 320), BR: point(572, 487), B: point(494, 306)
    }, [pass(435, 357, 494, 306)]);
    const first = frame('轉傳一壘雙殺', pivot.positions, {
      '1B': point(622, 411), BR: point(601, 467), B: point(607, 424)
    }, [pass(494, 306, 607, 424)]);
    return [start, field, pivot, first];
  }

  const buildFrames = {
    standard: () => [frame('起始站位', original)],
    relay, bunt, double: doublePlay
  };

  const drills = new Map((window.PracticeCatalog?.cases || []).map(drill => [drill.id, drill]));

  function makePlay(id = 'standard', variantId) {
    const drill = drills.get(id);
    if (drill) {
      const group = window.PracticeCatalog.groups.find(item => item.id === drill.groupId);
      const variant = drill.variants.find(item => item.id === variantId) || drill.variants[0];
      return window.buildPracticePlay(drill, group, variant.id, makePlay());
    }
    const preset = presets.find(item => item.id === id) || presets[0];
    return {
      title: preset.title, scenarioId: preset.id, inning: 1, half: 'top',
      outs: 0, batter: true, runTarget: preset.id === 'standard' ? 1 : null,
      bases: [preset.id === 'bunt' || preset.id === 'double', preset.id === 'relay', false],
      frames: buildFrames[preset.id]()
    };
  }

  const record = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const bounded = (value, min, max) => Number.isFinite(value) && value >= min && value <= max;
  const cleanText = (value, limit) => typeof value === 'string' ? value.trim().slice(0, limit) : '';

  function validFrame(data) {
    if (!record(data) || !record(data.positions) || !Array.isArray(data.lines) || data.lines.length > 200) return null;
    const name = cleanText(data.name, 80);
    if (!name) return null;
    const batterBase = data.batterBase === undefined ? 0 : data.batterBase;
    if (!Number.isInteger(batterBase) || !bounded(batterBase, 0, 4)) return null;
    if (data.batterOut !== undefined && typeof data.batterOut !== 'boolean') return null;
    const positions = {};
    for (const player of players) {
      const p = player.id === 'BR' && data.positions.BR === undefined
        ? batterStops[batterBase] : data.positions[player.id];
      if (!record(p) || !bounded(p.x, 0, 1000) || !bounded(p.y, 0, 620)) return null;
      positions[player.id] = point(p.x, p.y);
    }
    const lines = [];
    for (const line of data.lines) {
      if (!record(line) || !['move', 'throw'].includes(line.type)) return null;
      if (!bounded(line.x1, 0, 1000) || !bounded(line.x2, 0, 1000) ||
          !bounded(line.y1, 0, 620) || !bounded(line.y2, 0, 620)) return null;
      lines.push({ type: line.type, x1: line.x1, y1: line.y1, x2: line.x2, y2: line.y2 });
    }
    return { name, positions, lines, batterBase, ...(data.batterOut ? { batterOut: true } : {}) };
  }

  function validatePlay(data) {
    if (!record(data)) return null;
    const drill = drills.get(data.scenarioId);
    const firstPop = drill?.id === 'drill-first-pop';
    const legacyPop = firstPop && data.practiceRevision === undefined;
    const retiredBranch = legacyPop && data.practiceVariant === 'tag';
    if (drill ? !retiredBranch && !drill.variants.some(item => item.id === data.practiceVariant) : !presets.some(p => p.id === data.scenarioId)) return null;
    const title = cleanText(data.title, 100);
    if (data.batter !== undefined && typeof data.batter !== 'boolean') return null;
    if (data.runTarget != null && (!Number.isInteger(data.runTarget) || !bounded(data.runTarget, 1, 4))) return null;
    if (!title || !Number.isInteger(data.inning) || !bounded(data.inning, 1, 99)) return null;
    if (!['top', 'bottom'].includes(data.half) || !Number.isInteger(data.outs) || !bounded(data.outs, 0, 2)) return null;
    if (!Array.isArray(data.bases) || data.bases.length !== 3 ||
        ![0, 1, 2].every(index => typeof data.bases[index] === 'boolean')) return null;
    if (!Array.isArray(data.frames) || !data.frames.length || data.frames.length > 100) return null;
    const frames = [];
    for (const dataFrame of data.frames) {
      const checked = validFrame(dataFrame);
      if (!checked) return null;
      frames.push(checked);
    }
    let runTarget = data.runTarget;
    if (runTarget === undefined) {
      const authored = frames.some((entry, i) => i > 0 && batterMoves(frames[i - 1], entry));
      runTarget = data.batter === true && !authored ? 1 : null;
    }
    const play = {
      title, scenarioId: data.scenarioId, ...(drill ? { practiceVariant: data.practiceVariant } : {}), inning: data.inning, half: data.half,
      outs: data.outs, batter: data.batter === true, runTarget, bases: [...data.bases], frames
    };
    if (legacyPop) {
      // Upgrade an untouched example; retain hand-edited routes as an independent play.
      const variants = retiredBranch ? [{ id: 'tag', title: '踩壘後跑向二壘' }] : drill.variants;
      const group = window.PracticeCatalog.groups.find(g => g.id === drill.groupId);
      const old = window.buildPracticePlay({ ...drill, variants }, group, play.practiceVariant, makePlay(), 1);
      if (JSON.stringify(old.frames.map(validFrame)) === JSON.stringify(frames)) {
        const updated = makePlay(drill.id, retiredBranch ? 'stay' : play.practiceVariant);
        play.frames = updated.frames;
        play.practiceVariant = updated.practiceVariant;
        if (play.title === old.title) play.title = updated.title;
      } else {
        play.scenarioId = 'standard';
        delete play.practiceVariant;
        return play;
      }
    }
    if (firstPop) play.practiceRevision = 2;
    return play;
  }

  function interpolate(startFrame, endFrame, t) {
    const progress = Number.isFinite(t) ? Math.max(0, Math.min(1, t)) : 0;
    const result = {};
    for (const { id } of players) {
      const start = startFrame.positions[id];
      const end = endFrame.positions[id];
      result[id] = point(start.x + (end.x - start.x) * progress, start.y + (end.y - start.y) * progress);
    }
    return result;
  }

  const distance = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  const different = (a, b) => a.x !== b.x || a.y !== b.y;
  const unit = value => Number.isFinite(value) ? Math.min(1, Math.max(0, value)) : 0;

  function batterMoves(a, b) {
    return different(a.positions.BR, b.positions.BR) || b.batterBase > a.batterBase;
  }

  function ballSegments(frames) {
    const moving = [];
    for (let i = 0; i < frames.length - 1; i++) {
      if (different(frames[i].positions.B, frames[i + 1].positions.B)) moving.push(i);
    }
    if (moving.length < 2) return moving;
    const first = moving[0];
    const before = frames[first].positions.B, after = frames[first + 1].positions.B;
    const home = batterStops[4];
    const openingPitch = distance(before, original.P) <= 75 && distance(after, home) <= 55
      && distance(before, home) - distance(after, home) >= 30;
    if (openingPitch) {
      const contact = moving.findIndex(i => i > first && distance(frames[i].positions.B, home) <= 65
        && distance(frames[i + 1].positions.B, home) - distance(frames[i].positions.B, home) >= 15);
      if (contact >= 0) return moving.slice(contact);
    }
    return moving;
  }

  function trace(points) {
    const offsets = [0];
    for (let i = 1; i < points.length; i++) offsets.push(offsets[i - 1] + distance(points[i - 1], points[i]));
    const length = offsets[offsets.length - 1];
    function sample(progress) {
      if (progress <= 0 || length === 0) return { ...points[0] };
      if (progress >= 1) return { ...points[points.length - 1] };
      const traveled = progress * length;
      let low = 1, high = points.length - 1;
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (offsets[mid] < traveled) low = mid + 1;
        else high = mid;
      }
      const a = points[low - 1], b = points[low];
      const part = (traveled - offsets[low - 1]) / (offsets[low] - offsets[low - 1]);
      return point(a.x + (b.x - a.x) * part, a.y + (b.y - a.y) * part);
    }
    return { sample, offsets, length };
  }

  function authoredTrace(frames, first, last) {
    const points = [frames[first].positions.BR];
    for (let i = first + 1; i <= last; i++) {
      const position = frames[i].positions.BR;
      if (different(points[points.length - 1], position)) points.push(position);
    }
    // A direct move to a later bag may skip unrecorded touches. Insert the missing
    // bases in order with the smallest detour from the coach's existing waypoints.
    if (frames[last].batterBase > frames[first].batterBase) {
      if (points.length === 1) points.push(points[0]);
      let begin = 1;
      for (let base = frames[first].batterBase + 1; base <= frames[last].batterBase; base++) {
        const stop = batterStops[base];
        const existing = points.findIndex((p, i) => i >= begin && !different(p, stop));
        if (existing >= begin) {
          begin = existing + 1;
          if (begin === points.length && base < frames[last].batterBase) points.push(points[existing]);
          continue;
        }
        let insertion = begin, shortest = Infinity;
        for (let i = begin; i < points.length; i++) {
          const a = points[i - 1], b = points[i];
          const extra = distance(a, stop) + distance(stop, b) - distance(a, b);
          if (extra < shortest) { insertion = i; shortest = extra; }
        }
        points.splice(insertion, 0, stop);
        begin = insertion + 1;
      }
    }
    return trace(points).sample;
  }

  function manualRunner(frames, movingBall) {
    const start = frames[0].positions.BR;
    let first = -1, last = 0;
    for (let i = 1; i < frames.length; i++) {
      if (batterMoves(frames[i - 1], frames[i])) {
        if (first < 0) first = i - 1;
        last = i;
      }
    }
    if (first < 0) return () => ({ ...start });
    first = Math.min(first, movingBall[0] ?? 0);
    const perSegment = [];
    let from = first;
    for (let i = first + 1; i <= last; i++) {
      if (i !== last && frames[i].batterBase === frames[i - 1].batterBase) continue;
      const sample = authoredTrace(frames, from, i);
      const segmentStart = from, duration = i - from;
      const run = time => sample((time - segmentStart) / duration);
      for (let j = from; j < i; j++) perSegment[j] = run;
      from = i;
    }
    return time => {
      if (time <= first) return { ...start };
      if (time >= last) return { ...frames[last].positions.BR };
      return perSegment[Math.floor(time)](time);
    };
  }

  function sampleBatter(frames, segment, progress) {
    if (!frames.length) return null;
    const run = manualRunner(frames, ballSegments(frames));
    const i = Number.isFinite(segment) ? Math.max(0, Math.floor(segment)) : 0;
    return run(i + unit(progress));
  }

  function buildPlayback(play) {
    const frames = play.frames;
    const first = frames[0];
    const leadRunners = drills.has(play.scenarioId)
      ? ['R1', 'R2', 'R3'].filter((id, base) => play.bases[base]) : [];
    const movingBall = ballSegments(frames);
    let stepMs = 1600;
    const ballTravelMs = 1080;
    let runner;
    let baseAt = () => first.batterBase;
    if (!play.batter) {
      runner = () => ({ ...first.positions.BR });
    } else if (play.runTarget == null) {
      runner = manualRunner(frames, movingBall);
      baseAt = time => frames[Math.min(frames.length - 1, Math.floor(time))].batterBase;
    } else if (!movingBall.length || first.batterBase >= play.runTarget) {
      runner = () => ({ ...first.positions.BR });
    } else {
      const points = [first.positions.BR, ...batterStops.slice(first.batterBase + 1, play.runTarget + 1)];
      const route = trace(points);
      const begin = movingBall[0], end = movingBall[movingBall.length - 1] + 1;
      const basesToRun = play.runTarget - first.batterBase;
      stepMs = Math.max(stepMs, Math.ceil(3000 * basesToRun / movingBall.length));
      const progress = time => unit((time - begin) / (end - begin));
      runner = time => route.sample(progress(time));
      baseAt = time => {
        if (time <= begin) return first.batterBase;
        const traveled = route.length * progress(time);
        let reached = first.batterBase;
        for (let j = 1; j < route.offsets.length && traveled + 1e-8 >= route.offsets[j]; j++) reached++;
        return reached;
      };
    }
    function frameIndex(segmentIndex) {
      const requested = Number.isFinite(segmentIndex) ? Math.floor(segmentIndex) : 0;
      return Math.min(frames.length - 1, Math.max(0, requested));
    }
    function positionsAt(segmentIndex, fraction) {
      const i = frameIndex(segmentIndex);
      const next = Math.min(frames.length - 1, i + 1);
      const portion = unit(fraction);
      const travel = unit(portion * stepMs / ballTravelMs);
      const positions = interpolate(frames[i], frames[next], travel * travel * (3 - 2 * travel));
      // Practice runners can keep advancing while a fielder has the ball.
      // Identical successive positions mark a deliberate read, retouch or hold.
      for (const id of leadRunners) {
        const a = frames[i].positions[id], b = frames[next].positions[id];
        positions[id] = point(a.x + (b.x - a.x) * portion, a.y + (b.y - a.y) * portion);
      }
      positions.BR = runner(i + (next === i ? 0 : portion));
      return positions;
    }
    function batterBaseAt(segmentIndex, fraction) {
      const t = Math.min(frames.length - 1, frameIndex(segmentIndex) + unit(fraction));
      return baseAt(t);
    }
    return { stepMs, ballTravelMs, positionsAt, batterBaseAt };
  }

  window.TacticsModel = { players, presets, batterStops, clone, makePlay, validatePlay, interpolate, sampleBatter, buildPlayback };
})();

        const along = (vx * dx + vy * dy) * direction;
        const across = vx * dy - vy * dx;
        padding = Math.max(padding, along + Math.sqrt(Math.max(0, radius * radius - across * across)));
      }
      return Math.min(padding, length * .36);
    };
    const startPad = inset(a, 1), endPad = inset(b, -1);
    const start = { x: a.x + dx * startPad, y: a.y + dy * startPad };
    const end = { x: b.x - dx * endPad, y: b.y - dy * endPad };
    const head = Math.min(13, (length - startPad - endPad) * .45);
    const back = { x: end.x - dx * head, y: end.y - dy * head };

    const dash = isThrow ? '9 8' : 'none';
    const group = svg('g', { opacity: draft ? '.72' : '1', 'pointer-events': 'none' }, routes);

      group.setAttribute('role', 'button');
      group.setAttribute('aria-label', '刪除第 ' + (index + 1) + ' 條' + (isThrow ? '傳球線' : '跑位線'));
      group.addEventListener('focus', () => { group.style.filter = 'drop-shadow(0 0 5px #fff4a2)'; });
      group.addEventListener('blur', () => { group.style.filter = ''; });
      visibleLines.push({ index, start, end });
    }
    const path = 'M ' + start.x + ' ' + start.y + ' L ' + back.x + ' ' + back.y;
    svg('path', { d: path, fill: 'none', stroke: '#203b2c', 'stroke-width': 6.3, opacity: '.65', 'stroke-dasharray': dash, 'stroke-linecap': 'round' }, group);
    svg('path', { d: path, fill: 'none', stroke: color, 'stroke-width': 3.5, 'stroke-dasharray': dash, 'stroke-linecap': 'round' }, group);
    svg('path', {
      d: 'M ' + end.x + ' ' + end.y + ' L ' + (back.x - dy * head * .5) + ' ' + (back.y + dx * head * .5)
        + ' L ' + (back.x + dy * head * .5) + ' ' + (back.y - dx * head * .5) + ' Z',
      fill: color, stroke: '#294432', 'stroke-width': 1, 'stroke-linejoin': 'round'
    }, group);
  }

  function render(positionsOverride = null) {
    if (!api) return;
    const frame = frameNow(), mode = api.getMode();
    if (!context || context.frame !== frame || context.mode !== mode) clear();
    context = { frame, mode };
    const positions = { ...(positionsOverride || positionsNow()) };
    if (gesture?.drag && gesture.id) positions[gesture.id] = gesture.preview;
    const play = api.getPlay();
    const coverLabel = document.getElementById('cover-label');
    const cover = positions['2B'];
    const sharedBag = play.scenarioId === 'drill-first-pop' && play.bases[0] && distance(cover, positions.R1) < 32;
    coverLabel.setAttribute('visibility', sharedBag ? 'visible' : 'hidden');
    if (sharedBag) coverLabel.setAttribute('transform', 'translate(' + cover.x + ' ' + cover.y + ')');
    for (const player of window.TacticsModel.players) {
      const { group, ring } = nodes.get(player.id);
      const shown = visible(player);
      if (!shown && selected === player.id) selected = null;
      group.style.display = shown ? '' : 'none';
      group.style.cursor = mode === 'select' ? 'grab' : mode === 'playback' ? 'default' : 'crosshair';
      group.setAttribute('tabindex', shown && mode !== 'playback' && mode !== 'erase' ? 0 : -1);

    const end = gesture?.current || pending?.current;

  function putToken(id, point) {
    const dest = clamp(point, id === 'B' ? 13 : 22);
    const index = api.getIndex();
    if (distance(positionsNow()[id], dest) < 1) { render(); return; }
    api.commit(play => {
      if (id === 'BR') api.makeBatterManual?.(play);
      const frame = play.frames[index];
      frame.positions[id] = dest;
      if (id === 'BR') {
        const stops = window.TacticsModel.batterStops;
        const near = stop => distance(dest, stops[stop]) <= 32;
        const reached = [1, 2, 3].find(near);

        else if (frame.batterBase < 3 && (near(0) || near(4))) frame.batterBase = 0;

  }

  function addRoute(start, end) {
    if (distance(start, end) < 6) { pending = { start }; render(); return; }
    if (frameNow().lines.length >= 200) {
      api.notify('這個步驟已達 200 條路線。');
      pending = null;
      render();
      return;
    }
    const index = api.getIndex(), type = api.getMode();
    pending = null;
    api.commit(play => { play.frames[index].lines.push({ type, x1: start.x, y1: start.y, x2: end.x, y2: end.y }); });
  }

  function erase(index) {
    const frameIndex = api.getIndex();
    api.commit(play => { play.frames[frameIndex].lines.splice(index, 1); });
    api.notify('已移除路線。');
  }

  function eraseAt(point, pointerType) {
    const scale = field.getScreenCTM().a || 1;
    let nearest = -1, threshold = (pointerType === 'touch' ? 16 : 9) / scale;
    for (const { start, end, index } of visibleLines) {
      const dx = end.x - start.x, dy = end.y - start.y;
      const projection = ((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy || 1);
      const fraction = Math.max(0, Math.min(1, projection));
      const d = Math.hypot(start.x + dx * fraction - point.x, start.y + dy * fraction - point.y);
      if (d <= threshold) { nearest = index; threshold = d; }
    }

  }

  function pointerDown(event) {
    const mode = api.getMode();
    if (mode === 'playback' || gesture || event.button !== 0) return;
    const point = localPoint(event);
    const marker = event.target.closest('[data-player]');
    const id = marker?.getAttribute('data-player');
    if (mode === 'select' && !id && !selected) return;
    event.preventDefault();
    if (marker && mode !== 'erase') marker.focus({ preventScroll: true });
    if (mode === 'select' && id) selected = id;
    gesture = {
      pointer: event.pointerId, start: point, current: point,
      screenX: event.clientX, screenY: event.clientY, id: mode === 'select' ? id : null,
      origin: id ? positionsNow()[id] : null, drag: false
    };
    field.setPointerCapture(event.pointerId);
    render();
  }

  function updateGesture(event) {
    gesture.current = localPoint(event);
    gesture.drag ||= Math.hypot(event.clientX - gesture.screenX, event.clientY - gesture.screenY) >= 4;
    if (gesture.drag && gesture.id) {
      gesture.preview = clamp({
        x: gesture.origin.x + gesture.current.x - gesture.start.x,
        y: gesture.origin.y + gesture.current.y - gesture.start.y
      }, gesture.id === 'B' ? 13 : 22);
    }
  }

  function pointerMove(event) {
    if (api.getMode() === 'playback') return;
    if (gesture?.pointer === event.pointerId) {
      updateGesture(event);
      render();
    } else if (!gesture && pending && event.pointerType !== 'touch') {
      pending.current = localPoint(event);
      render();
    }
  }

  function pointerUp(event) {
    if (gesture?.pointer !== event.pointerId) return;
    updateGesture(event);
    const action = gesture;
    release();
    const mode = api.getMode();
    if (mode === 'playback') return;
    if (mode === 'erase') {
      if (!action.drag) eraseAt(action.current, event.pointerType);
      return;
    }
    if (mode === 'select') {
      if (action.id && action.drag) putToken(action.id, action.preview);
      else if (!action.id && selected) {

        selected = null;
        putToken(id, action.current);

      addRoute(pending?.start || action.start, action.current);
    } else {
      pending = { start: action.start };
      render();
    }
  }

  function keyDown(event) {
    if (api.getMode() === 'playback') return;
    if (api.getMode() === 'erase') {
      const target = event.target.closest('[data-route]');
      if (target && [' ', 'Enter', 'Delete', 'Backspace'].includes(event.key)) {
        event.preventDefault();
        const index = Number(target.getAttribute('data-route'));
        erase(index);
        const remaining = routes.querySelectorAll('[data-route]');
        const next = remaining[Math.min(index, remaining.length - 1)];
        if (next) next.focus({ preventScroll: true });
        else {
          field.setAttribute('tabindex', '-1');
          field.focus({ preventScroll: true });
        }
      }
      return;
    }
    const id = event.target.closest('[data-player]')?.getAttribute('data-player');
    if (!id) return;
    const pos = positionsNow()[id];
    if (event.key === ' ' || event.key === 'Enter') {
      event.preventDefault();

      }
      render();
      return;
    }
    const offsets = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };

    event.preventDefault();
    selected = id;
    const step = event.shiftKey ? 15 : 3;
    putToken(id, { x: pos.x + offset[0] * step, y: pos.y + offset[1] * step });
  }

  function cancelGesture() {
    clear();
    render();
  }

  function init(options) {
    api = options;
    field = document.getElementById('field');
    tokens = document.getElementById('tokens');
    routes = document.getElementById('routes');
    const players = window.TacticsModel.players;
    for (const player of players) if (player.kind !== 'ball') addToken(player);
    addToken(players.find(player => player.kind === 'ball'));
    field.addEventListener('pointerdown', pointerDown);
    field.addEventListener('pointermove', pointerMove);
    field.addEventListener('pointerup', pointerUp);
    for (const eventName of ['pointercancel', 'lostpointercapture']) {
      field.addEventListener(eventName, event => { if (gesture?.pointer === event.pointerId) cancelGesture(); });
    }
    field.addEventListener('keydown', keyDown);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && (gesture || pending || selected)) cancelGesture();
    });
    render();
  }

  window.FieldBoard = { init, render, cancelGesture };
})();

<script>(() => {

  }

  function view(title) {

    footer.style.flexWrap = 'wrap';
    const status = element('p');
    status.style.color = '#803e27';
    status.setAttribute('role', 'alert');
    status.hidden = true;
    body.append(status);

      body, footer,
      error(message) {
        status.textContent = message;
        status.hidden = false;
        status.scrollIntoView({ block: 'nearest' });
      }
    };
  }

  function validateEntries(items) {
    if (!Array.isArray(items) || items.length > 100) throw new Error('library');
    return items.map(item => {
      if (!item || typeof item.id !== 'string' || item.id.length > 80 ||
          !Number.isFinite(item.time)) throw new Error('entry');
      const play = model().validatePlay(item.play);
      if (!play) throw new Error('play');
      return { id: item.id, time: item.time, play };

  }

  function readSaved() {
    return validateEntries(JSON.parse(localStorage.getItem(libraryKey) || '[]'));
  }

  function showConcepts() {
    const list = document.getElementById('concept-list');
    const count = document.getElementById('concept-count');
    let entries;
    try {
      entries = validateEntries(JSON.parse(document.getElementById('concept-seed').textContent));
    } catch {
      list.replaceChildren(element('p', 'concept-empty', '無法讀取匯出的戰術資料。'));
      count.textContent = '';
      return;
    }
    count.textContent = entries.length ? entries.length + ' 個戰術 · 點選載入球場' : '';
    list.replaceChildren();
    for (const entry of entries) {
      const play = entry.play;
      const card = button('', () => {
        if (app().loadPlay(play)) {
          document.getElementById('field-panel').scrollIntoView({ block: 'start', behavior: 'instant' });
          const heading = document.getElementById('field-heading');
          heading.tabIndex = -1;
          heading.focus({ preventScroll: true });
          app().notify('已載入「' + play.title + '」');
        }
      }, 'concept-card');
      card.dataset.conceptId = entry.id;
      const bases = ['一', '二', '三'].filter((_, i) => play.bases[i]);
      const situation = bases.length === 3 ? '滿壘' : bases.length ? bases.join('、') + '壘有人' : '壘上無人';
      card.append(element('strong', 'concept-title', play.title),
        element('span', 'concept-details', situation + ' · ' + play.outs + ' 出局 · ' + play.frames.length + ' 個步驟'));
      list.append(card);
    }
    if (!entries.length) list.append(element('p', 'concept-empty', '目前沒有已匯出的戰術。'));
  }

  function saveDraft() {
    try {
      const play = model().validatePlay(app().getPlay());
      if (!play) return false;
      localStorage.setItem(draftKey, JSON.stringify(play));
      return true;
    } catch {
      return false;
    }
  }

  function restoreDraft() {
    try {
      const stored = localStorage.getItem(draftKey);

    } catch {
      return null;
    }

      ['設定局面', '選擇守備範本，再設定局數、出局數與壘上跑者。'],

  function openSave() {

  function commitSave(id, play, error) {

<script>(() => {
  'use strict';

  const svgNS = 'http://www.w3.org/2000/svg';

    const node = document.createElement(tag);

    if (text) node.textContent = text;
    return node;
  }

  function svgPart(name, attrs, parent) {
    const node = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.append(node);
  }

  function diamond(group) {
    const icon = document.createElementNS(svgNS, 'svg');
    icon.setAttribute('viewBox', '0 0 38 28');
    icon.setAttribute('aria-hidden', 'true');
    icon.classList.add('practice-diamond');
    svgPart('path', { d: 'M 19 24 L 30 13 L 19 3 L 8 13 Z', fill: 'none', stroke: 'currentColor', opacity: '.6', 'stroke-width': '1.3' }, icon);

      svgPart('rect', {
        x: cx - 2.65, y: cy - 2.65, width: 5.3, height: 5.3, transform: 'rotate(45 ' + cx + ' ' + cy + ')',
        fill: group.bases[index] ? 'var(--clay)' : 'var(--surface)', stroke: group.bases[index] ? 'var(--clay)' : 'currentColor'
      }, icon);
    });
    svgPart('path', { d: 'M 17 22 h 4 v 2 l -2 1.6 l -2 -1.6 Z', fill: 'currentColor' }, icon);
    return icon;
  }

  function rules(group) {
    if (group.outs === 2) return '兩出局。預設滿壘，可在「比賽情境」調整起始壘位。';
    return '觀察' + baseNames[group.focus - 1] + '跑者。適用於少於兩出局，預設 0 出局，可改為 1 出局。';
  }

  function showField() {
    const panel = document.getElementById('field-panel');

    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });

    if (rect.top < 0 || rect.top >= window.innerHeight) panel.scrollIntoView({ block: 'start', behavior: 'instant' });
  }

  function choose(drill, variantId, jump) {
    if (locked) return;

    selectedGroup = group.id;

        const play = api.getPlay();

  }

    active.replaceChildren();

    header.append(titleWrap);
    const body = element('div', 'panel-body practice-active-body');
    const context = element('p', 'practice-active-context', group.title);
    const name = element('h3', 'practice-active-name', drill.title);
    const note = element('p', 'practice-teaching', drill.note);

    body.append(context, name, note);
    if (drill.variants.length > 1) {
      const label = element('label', 'field-label', '跑壘分支');
      label.htmlFor = 'practice-variant';
      const select = element('select', 'practice-select');
      select.id = 'practice-variant';
      for (const v of drill.variants) {

        option.value = v.id;
        select.append(option);
      }
      select.addEventListener('change', () => choose(drill, select.value, false));
      const controls = element('div', 'practice-variation');

    }
    active.append(header, body);
  }

  function sync(play, playing = false) {
    if (!api) return;
    const drill = catalog.cases.find(item => item.id === play.scenarioId);
    const changed = currentCase !== (drill?.id || null);
    const wasLocked = locked;
    locked = Boolean(playing);
    currentCase = drill?.id || null;
    currentVariant = drill ? (drill.variants.find(v => v.id === play.practiceVariant) || drill.variants[0]).id : null;
    if (changed && drill) {

    for (const group of catalog.groups) {
      const button = element('button', 'practice-group');
      button.type = 'button';
      button.dataset.practiceGroup = group.id;
      button.setAttribute('aria-label', group.title);
      button.append(diamond(group), element('span', '', group.shortTitle));
      button.addEventListener('click', () => { if (selectedGroup !== group.id) displayGroup(group); });
      groups.append(button);
    }
    const content = element('div', 'practice-group-content');
    groupTitle = element('h3', 'practice-group-title');
    groupRules = element('p', 'practice-group-rules');
    caseList = element('div', 'practice-cases');
    content.append(groupTitle, groupRules, caseList);
    panel.append(groups, content);
    library.replaceChildren(heading, panel);
    displayGroup(catalog.groups[0]);
    sync(api.getPlay());
  }

  window.PracticeUI = { init, sync };
})();
</script>

    commit(p => {
      const next = clone(p.frames[index]);
      next.name = '步驟 ' + (index + 2);
      next.lines = [];
      p.frames.splice(++index, 0, next);
    });
    notify('已複製上一個站位，可開始調整這個步驟。');
  };
  const stepDialog = byId('step-dialog');
  let editIndex = 0;
  byId('step-list').onclick = event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    board.cancelGesture();
    if (button.dataset.edit !== undefined) {
      editIndex = +button.dataset.edit;
      byId('step-name').value = play.frames[editIndex].name;
      byId('step-delete').disabled = play.frames.length === 1;
      stepDialog.showModal();
      byId('step-name').select();
    } else { index = +button.dataset.index; render(); }
  };
  byId('step-form').onsubmit = event => {
    event.preventDefault();
    const name = byId('step-name').value.trim();
    if (!name) { byId('step-name').focus(); return; }
    stepDialog.close();
    if (name !== play.frames[editIndex].name) commit(p => { p.frames[editIndex].name = name; });
  };
  byId('step-close').onclick = () => stepDialog.close();
  byId('step-delete').onclick = () => {
    if (play.frames.length < 2) return;
    stepDialog.close();
    commit(p => { p.frames.splice(editIndex, 1); if (editIndex < index) index--; });
    notify('已刪除步驟，可用「復原」取回。');
  };
  function expand(value) {
    byId('field-panel').classList.toggle('is-expanded', value);
    document.body.classList.toggle('field-expanded', value);
    const button = byId('expand');
    button.setAttribute('aria-pressed', String(value));
    button.innerHTML = icon(value ? 'shrink' : 'expand');
    button.title = value ? '還原球場大小' : '放大球場';
    button.setAttribute('aria-label', button.title);
    for (const node of [document.querySelector('.topbar'), document.querySelector('.page-head'), document.querySelector('.sidebar'), byId('important-concepts'), byId('practice-library'), byId('presets').parentElement]) node.inert = value;
    button.focus({ preventScroll: true });
  }
  byId('expand').onclick = () => expand(!document.body.classList.contains('field-expanded'));
  document.addEventListener('keydown', e => {
    if (document.querySelector('dialog[open]') || e.target.matches('input, textarea, [contenteditable=true]')) return;
    if (e.key === 'Escape') {
      board.cancelGesture();
      if (animation) stopPlayback();
      if (document.body.classList.contains('field-expanded')) expand(false);
    }
    if (!animation && (e.ctrlKey || e.metaKey) && ['z', 'y'].includes(e.key.toLowerCase())) {
      e.preventDefault();
      if (e.key.toLowerCase() === 'y' || e.shiftKey) history(redoStack, undoStack);
      else history(undoStack, redoStack);
    }
  });

  function miniature(id) {
    const palettes = { standard: ['#dce8d7','#6f9670'], relay: ['#dce9e3','#77988a'], bunt: ['#f3e5cf','#bc8c59'], double: ['#e3e8e2','#829586'] };
    const [base, stripe] = palettes[id];
    const route = { standard: '', relay: 'M17 29l16 7 10 19', bunt: 'M43 54l-5-11 16-1', double: 'M33 37l10-10 13 15' }[id];
    return '<svg viewBox="0 0 86 68" aria-hidden="true"><rect width="86" height="68" fill="' + base + '"/><path d="M7 26Q19 5 43 5t36 21L43 62Z" fill="' + stripe + '" opacity=".34"/><path d="M10 26Q21 8 43 8t33 18L43 58Z" fill="none" stroke="' + stripe + '" stroke-width="1.3"/><path d="M43 57 25 40q4-15 18-15t18 15z" fill="#d5b78f"/><path d="m43 32 11 11-11 11-11-11z" fill="' + stripe + '"/><path d="m18 30 25 26 25-26" fill="none" stroke="#fff8e7"/><path d="' + route + '" fill="none" stroke="#954f2d" stroke-width="2" stroke-dasharray="3 2"/>' + [[23,25],[43,16],[63,25],[33,36],[53,36],[27,42],[59,42],[43,44],[43,58]].map(([x,y]) => '<circle cx="' + x + '" cy="' + y + '" r="1.65" fill="#365842"/>').join('') + '</svg>';
  }
  for (const preset of presets) {
    const button = document.createElement('button');
    button.className = 'preset-card';
    button.innerHTML = '<div class="preset-art">' + miniature(preset.id) + '</div><div class="preset-copy"><h3></h3><p></p></div>';
    button.querySelector('h3').textContent = preset.title;
    button.querySelector('p').textContent = preset.description;
    button.onclick = () => {
      loadPlay(makePlay(preset.id));
      notify('已載入「' + preset.title + '」');
      if (matchMedia('(max-width:850px)').matches) byId('field-panel').scrollIntoView({ block: 'start' });
    };
    byId('presets').append(button);
  }
  library.showConcepts();
  render();
})();
</script>
</body>
</html>
